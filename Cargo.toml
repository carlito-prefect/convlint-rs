[package]
name = "convlint"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.3"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"
